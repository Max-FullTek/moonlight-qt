[package]
name = "rust-host-api-probe"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"

# Capability probe only; deliberately not a dependency of the GPUI frontend.
[dependencies]
moonlight-host-api = { path = "../../windows-lite/host-api" }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "=2.2.0"
quick-xml = "=0.42.0"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "time", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }

[profile.dev]
incremental = false

[profile.release]
opt-level = 2
debug = false
