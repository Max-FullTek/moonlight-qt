[package]
name = "moonlight-lite-gpui-prototype"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"

[dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
debug = false

