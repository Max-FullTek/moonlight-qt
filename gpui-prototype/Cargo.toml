[package]
name = "moonlight-lite-gpui-prototype"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"

[dependencies]
moonlight-host-api = { path = "../windows-lite/host-api" }
tokio = { version = "1", features = ["rt", "sync"] }
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "=3.27.0"
raw-window-handle = "0.6"

[profile.release]
opt-level = 2
debug = false

