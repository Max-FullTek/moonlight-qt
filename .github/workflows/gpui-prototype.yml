name: GPUI Windows prototype

on:
  workflow_dispatch:
  push:
    branches: [codex/self-build-v6.5.0]
    paths:
      - gpui-prototype/**
      - .github/workflows/gpui-prototype.yml

permissions:
  contents: read

jobs:
  prototype:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/build/gpui-target
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/gpui-target
          key: gpui-windows-rust-1.99.1-${{ hashFiles('gpui-prototype/Cargo.lock') }}
          restore-keys: gpui-windows-rust-1.99.1-
      - name: Format, test and build
        working-directory: gpui-prototype
        shell: pwsh
        run: |
          cargo +1.99.1 fmt --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo +1.99.1 test --release --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo +1.99.1 build --release --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always() && steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/gpui-target
          key: gpui-windows-rust-1.99.1-${{ hashFiles('gpui-prototype/Cargo.lock') }}
      - name: Package prototype and provenance
        shell: pwsh
        run: ./gpui-prototype/package.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: moonlight-gpui-prototype-${{ github.sha }}
          path: build/gpui-package/*
          if-no-files-found: error
          retention-days: 30
